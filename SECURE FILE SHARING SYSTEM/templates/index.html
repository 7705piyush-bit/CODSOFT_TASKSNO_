{% extends "base.html" %}
{% block title %}Login - SecureShare{% endblock %}
{% block unauthenticated_content %}
<div class="card auth-card p-4">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock brand fs-1"></i>
    <h2 class="brand mt-2">SecureShare</h2>
    <p class="text-secondary">Encrypted file sharing system</p>
  </div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" required autocomplete="username">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign In</button>
  </form>
  <p class="text-center mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
